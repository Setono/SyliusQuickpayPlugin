parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '5.7'
        charset: UTF8
        # dama/doctrine-test-bundle wraps each functional test in a transaction it rolls back, so
        # every flush inside a test is a nested transaction
        use_savepoints: true

        url: '%env(resolve:DATABASE_URL)%'
