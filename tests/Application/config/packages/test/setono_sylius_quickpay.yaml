# Quickpay's HTTP is the one thing the functional tests substitute, below the plugin's scoped HTTP client: every
# request to Quickpay, the gateways' and the plugin's own, goes through the real client provider, SDK clients and
# HTTP policy, and reaches the scripted client, which a test scripts and asserts on
framework:
    http_client:
        mock_response_factory: Setono\SyliusQuickpayPlugin\Tests\Quickpay\ScriptedHttpClient

    # The reconcile command's watermarks and retry list live in memory, so each booted kernel starts with none, as a
    # first run would; public, so a test can see what a run stored
    cache:
        pools:
            setono_sylius_quickpay.reconcile:
                adapter: cache.adapter.array
                public: true

services:
    Setono\SyliusQuickpayPlugin\Tests\Quickpay\ScriptedHttpClient:
        public: true

    # The functional tests reach the reconciliation module through its interface, whether or not anything
    # else in the container consumes it
    Setono\SyliusQuickpayPlugin\Reconciliation\PaymentReconcilerInterface:
        alias: Setono\SyliusQuickpayPlugin\Reconciliation\PaymentReconciler
        public: true

    # ...and the pending payments of a reconcile run likewise
    Setono\SyliusQuickpayPlugin\Reconciliation\PendingPaymentsInterface:
        alias: Setono\SyliusQuickpayPlugin\Reconciliation\PendingPayments
        public: true

    # ...and the gateway configuration module likewise
    Setono\SyliusQuickpayPlugin\GatewayConfiguration\GatewayConfigurationProviderInterface:
        alias: Setono\SyliusQuickpayPlugin\GatewayConfiguration\GatewayConfigurationProvider
        public: true
