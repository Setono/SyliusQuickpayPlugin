setono_sylius_quickpay:
    payum_gateway_factory:
        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'Chave da API'
                api_key_help: 'A chave da API do utilizador API no seu manager Quickpay (Definições → Utilizadores)'
                private_key: 'Chave privada'
                private_key_help: 'A chave privada da sua conta (Definições → Integração no manager Quickpay)'
                agreement_id: 'ID do acordo'
                agreement_id_help: 'Opcional: qual acordo a janela de pagamento usa. Deixe vazio para usar o acordo padrão da janela de pagamento da sua conta Quickpay — preencha apenas se a sua conta tiver vários acordos e a janela dever usar um específico'
                payment_methods: 'Métodos de pagamento'
                payment_methods_help: 'Lista separada por vírgulas dos métodos de pagamento oferecidos na janela de pagamento — consulte a <a href="https://learn.quickpay.net/tech-talk/appendixes/payment-methods/#payment-methods" target="_blank" rel="noopener">documentação da Quickpay</a>'
                capture_mode: 'Momento da captura'
                capture_mode_help: 'Quando o dinheiro é cobrado. "Na conclusão" apenas autoriza o pagamento no checkout e captura-o quando o pagamento é concluído no Sylius (por ex. quando a encomenda é enviada) — a predefinição, e o que as lojas que não podem capturar antes do envio precisam. "Imediatamente" deixa a Quickpay capturar assim que o cartão é autorizado — útil para produtos digitais'
                capture_mode_option:
                    on_completion: 'Na conclusão — autorizar no checkout, capturar quando o pagamento é concluído'
                    immediately: 'Imediatamente — capturar no checkout'
                synchronized: 'Operações síncronas'
                synchronized_help: 'Executar a captura, o reembolso e o cancelamento de forma síncrona em vez de depender do callback da Quickpay'
                order_prefix: 'Prefixo do pedido'
                order_prefix_help: 'Adicionado antes dos números de pedido para formar o ID de pedido Quickpay — deve ser único por projeto e ambiente que partilham a mesma conta Quickpay, no máximo 11 caracteres'
                branding_id: 'ID de branding'
                branding_id_help: 'Opcional: o ID do branding da janela de pagamento a usar'
    ui:
        operations: 'Operações Quickpay'
        loading: 'A carregar o histórico de operações da Quickpay…'
        load_failed: 'Não foi possível carregar o histórico de operações da Quickpay.'
        retry: 'Tentar novamente'
        type: 'Tipo'
        amount: 'Montante'
        status: 'Estado'
        date: 'Data'
        pending: 'pendente'
        no_operations: 'Ainda sem operações'
        balance: 'Saldo capturado'
        test_mode: 'Modo de teste'
        payment_link: 'Link de pagamento'
        payment_link_help: 'Qualquer pessoa com este link pode pagar a encomenda na janela de pagamento da Quickpay — envie-o ao cliente para cobrar uma encomenda por telefone ou fatura, ou após um checkout abandonado.'
        copy: 'Copiar'
        copied: 'Copiado'
        send_payment_link: 'Enviar o link de pagamento para %email%'
    email:
        payment_link:
            subject: 'Pagamento da encomenda %order_number%'
            intro: 'A sua encomenda %order_number% aguarda um pagamento de %amount% — use o botão abaixo para pagar em segurança na janela de pagamento da Quickpay.'
            action: 'Pagar agora'
            fallback: 'Se o botão não funcionar, copie este link para o seu navegador:'
