setono_sylius_quickpay:
    payum_gateway_factory:
        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'API-Schlüssel'
                api_key_help: 'Der API-Schlüssel des API-Benutzers in Ihrem Quickpay-Manager (Einstellungen → Benutzer)'
                private_key: 'Privater Schlüssel'
                private_key_help: 'Der private Schlüssel Ihres Kontos (Einstellungen → Integration im Quickpay-Manager)'
                agreement_id: 'Vereinbarungs-ID'
                agreement_id_help: 'Optional: welche Vereinbarung das Zahlungsfenster verwendet. Leer lassen, um die Standard-Zahlungsfenster-Vereinbarung Ihres Quickpay-Kontos zu verwenden — nur ausfüllen, wenn Ihr Konto mehrere Vereinbarungen hat und das Fenster eine bestimmte verwenden soll'
                payment_methods: 'Zahlungsarten'
                payment_methods_help: 'Kommagetrennte Liste der im Zahlungsfenster angebotenen Zahlungsarten — siehe die <a href="https://learn.quickpay.net/tech-talk/appendixes/payment-methods/#payment-methods" target="_blank" rel="noopener">Quickpay-Dokumentation</a>'
                capture_mode: 'Zeitpunkt der Belastung'
                capture_mode_help: 'Wann das Geld eingezogen wird. "Bei Abschluss" autorisiert die Zahlung beim Checkout nur und zieht sie ein, wenn die Zahlung in Sylius abgeschlossen wird (z. B. beim Versand der Bestellung) — der Standard, und was Shops benötigen, die vor dem Versand nicht einziehen dürfen. "Sofort" lässt Quickpay einziehen, sobald die Karte autorisiert ist — praktisch für digitale Produkte'
                capture_mode_option:
                    on_completion: 'Bei Abschluss — beim Checkout autorisieren, bei Abschluss der Zahlung einziehen'
                    immediately: 'Sofort — beim Checkout einziehen'
                synchronized: 'Synchrone Vorgänge'
                synchronized_help: 'Erfassung, Erstattung und Stornierung synchron ausführen, statt auf den Quickpay-Callback zu warten'
                order_prefix: 'Bestellpräfix'
                order_prefix_help: 'Wird Bestellnummern vorangestellt und bildet die Quickpay-Bestell-ID — muss je Projekt und Umgebung mit demselben Quickpay-Konto eindeutig sein, höchstens 11 Zeichen'
                branding_id: 'Branding-ID'
                branding_id_help: 'Optional: die ID des zu verwendenden Zahlungsfenster-Brandings'
    ui:
        operations: 'Quickpay-Vorgänge'
        loading: 'Quickpay-Vorgangshistorie wird geladen…'
        load_failed: 'Die Vorgangshistorie konnte nicht von Quickpay geladen werden.'
        retry: 'Erneut versuchen'
        type: 'Typ'
        amount: 'Betrag'
        status: 'Status'
        date: 'Datum'
        pending: 'ausstehend'
        no_operations: 'Noch keine Vorgänge'
        balance: 'Erfasster Saldo'
        test_mode: 'Testmodus'
        payment_link: 'Zahlungslink'
        payment_link_help: 'Jeder mit diesem Link kann die Bestellung im Quickpay-Zahlungsfenster bezahlen — senden Sie ihn dem Kunden, um eine Telefon- oder Rechnungsbestellung einzuziehen oder nach einem abgebrochenen Checkout.'
        copy: 'Kopieren'
        copied: 'Kopiert'
        send_payment_link: 'Zahlungslink an %email% senden'
    email:
        payment_link:
            subject: 'Zahlung für Bestellung %order_number%'
            intro: 'Ihre Bestellung %order_number% wartet auf die Zahlung von %amount% — über die Schaltfläche unten bezahlen Sie sicher im Quickpay-Zahlungsfenster.'
            action: 'Jetzt bezahlen'
            fallback: 'Falls die Schaltfläche nicht funktioniert, kopieren Sie diesen Link in Ihren Browser:'
