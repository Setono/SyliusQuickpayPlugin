                capture_mode: 'Momento dell''addebito'
                capture_mode_help: 'Quando viene prelevato il denaro. "Al completamento" autorizza soltanto il pagamento al checkout e lo addebita quando il pagamento viene completato in Sylius (ad es. alla spedizione dell''ordine) — l''impostazione predefinita, e ciò di cui hanno bisogno i negozi che non possono addebitare prima della spedizione. "Immediatamente" lascia che Quickpay addebiti non appena la carta è autorizzata — utile per i prodotti digitali'
                capture_mode_option:
                    on_completion: 'Al completamento — autorizza al checkout, addebita quando il pagamento viene completato'
                    immediately: 'Immediatamente — addebita al checkout'
                synchronized: 'Operazioni sincrone'
                synchronized_help: 'Esegui cattura, rimborso e annullamento in modo sincrono invece di affidarti al callback di Quickpay'
                order_prefix: 'Prefisso ordine'
                order_prefix_help: 'Anteposto ai numeri d''ordine per formare l''ID ordine Quickpay — deve essere univoco per progetto e ambiente che condividono lo stesso account Quickpay, massimo 11 caratteri'
                branding_id: 'ID branding'
                branding_id_help: 'Facoltativo: l''ID del branding della finestra di pagamento da usare'
    ui:
        operations: 'Operazioni Quickpay'
        loading: 'Caricamento della cronologia operazioni Quickpay…'
        load_failed: 'Impossibile caricare la cronologia operazioni da Quickpay.'
        retry: 'Riprova'
        type: 'Tipo'
        amount: 'Importo'
        status: 'Stato'
        date: 'Data'
