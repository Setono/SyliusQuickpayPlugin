        copy: 'Copia'
        copied: 'Copiato'
        send_payment_link: 'Invia il link di pagamento a %email%'
    email:
        payment_link:
            subject: 'Pagamento dell''ordine %order_number%'
            intro: 'Il tuo ordine %order_number% è in attesa di un pagamento di %amount% — usa il pulsante qui sotto per pagare in sicurezza nella finestra di pagamento Quickpay.'
