        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'Chiave API'
                api_key_help: 'La chiave API dell''utente API nel tuo manager Quickpay (Impostazioni → Utenti)'
                private_key: 'Chiave privata'
                private_key_help: 'La chiave privata del tuo account (Impostazioni → Integrazione nel manager Quickpay)'
                agreement_id: 'ID accordo'
                agreement_id_help: 'Facoltativo: l''ID accordo usato per la finestra di pagamento'
                payment_methods: 'Metodi di pagamento'
