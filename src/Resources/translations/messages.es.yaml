setono_sylius_quickpay:
    payum_gateway_factory:
        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'Clave API'
                api_key_help: 'La clave API del usuario API en su manager de Quickpay (Ajustes → Usuarios)'
                private_key: 'Clave privada'
                private_key_help: 'La clave privada de su cuenta (Ajustes → Integración en el manager de Quickpay)'
                agreement_id: 'ID del acuerdo'
                agreement_id_help: 'Opcional: qué acuerdo usa la ventana de pago. Déjelo vacío para usar el acuerdo de ventana de pago predeterminado de su cuenta Quickpay — rellénelo solo si su cuenta tiene varios acuerdos y la ventana debe usar uno concreto'
                payment_methods: 'Métodos de pago'
                payment_methods_help: 'Lista separada por comas de los métodos de pago ofrecidos en la ventana de pago — vea la <a href="https://learn.quickpay.net/tech-talk/appendixes/payment-methods/#payment-methods" target="_blank" rel="noopener">documentación de Quickpay</a>'
                capture_mode: 'Momento de la captura'
                capture_mode_help: 'Cuándo se cobra el dinero. "Al completar" solo autoriza el pago en el checkout y lo captura cuando el pago se completa en Sylius (p. ej. al enviar el pedido) — el valor por defecto, y lo que necesitan las tiendas que no pueden capturar antes del envío. "Inmediatamente" deja que Quickpay capture en cuanto se autoriza la tarjeta — útil para productos digitales'
                capture_mode_option:
                    on_completion: 'Al completar — autorizar en el checkout, capturar cuando se complete el pago'
                    immediately: 'Inmediatamente — capturar en el checkout'
                synchronized: 'Operaciones síncronas'
                synchronized_help: 'Ejecutar la captura, el reembolso y la cancelación de forma síncrona en lugar de depender del callback de Quickpay'
                order_prefix: 'Prefijo de pedido'
                order_prefix_help: 'Se antepone a los números de pedido para formar el ID de pedido de Quickpay — debe ser único por proyecto y entorno que compartan la misma cuenta de Quickpay, máximo 11 caracteres'
                branding_id: 'ID de branding'
                branding_id_help: 'Opcional: el ID del branding de la ventana de pago a usar'
    ui:
        operations: 'Operaciones de Quickpay'
        loading: 'Cargando el historial de operaciones de Quickpay…'
        load_failed: 'No se pudo cargar el historial de operaciones desde Quickpay.'
        retry: 'Reintentar'
        type: 'Tipo'
        amount: 'Importe'
        status: 'Estado'
        date: 'Fecha'
        pending: 'pendiente'
        no_operations: 'Aún no hay operaciones'
        balance: 'Saldo capturado'
        test_mode: 'Modo de prueba'
        payment_link: 'Enlace de pago'
        payment_link_help: 'Cualquiera con este enlace puede pagar el pedido en la ventana de pago de Quickpay — envíeselo al cliente para cobrar un pedido telefónico o con factura, o tras un checkout abandonado.'
        copy: 'Copiar'
        copied: 'Copiado'
        send_payment_link: 'Enviar el enlace de pago a %email%'
    email:
        payment_link:
            subject: 'Pago del pedido %order_number%'
            intro: 'Su pedido %order_number% está pendiente de un pago de %amount% — use el botón de abajo para pagar de forma segura en la ventana de pago de Quickpay.'
            action: 'Pagar ahora'
            fallback: 'Si el botón no funciona, copie este enlace en su navegador:'
