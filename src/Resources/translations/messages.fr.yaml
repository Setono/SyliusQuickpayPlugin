setono_sylius_quickpay:
    payum_gateway_factory:
        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'Clé API'
                api_key_help: 'La clé API de l''utilisateur API dans votre manager Quickpay (Paramètres → Utilisateurs)'
                private_key: 'Clé privée'
                private_key_help: 'La clé privée de votre compte (Paramètres → Intégration dans le manager Quickpay)'
                agreement_id: 'ID de l''accord'
                agreement_id_help: 'Facultatif : l''accord utilisé par la fenêtre de paiement. Laissez vide pour utiliser l''accord de fenêtre de paiement par défaut de votre compte Quickpay — ne le renseignez que si votre compte a plusieurs accords et que la fenêtre doit en utiliser un en particulier'
                payment_methods: 'Méthodes de paiement'
                payment_methods_help: 'Liste séparée par des virgules des méthodes de paiement proposées dans la fenêtre de paiement — voir la <a href="https://learn.quickpay.net/tech-talk/appendixes/payment-methods/#payment-methods" target="_blank" rel="noopener">documentation Quickpay</a>'
                capture_mode: 'Moment de la capture'
                capture_mode_help: 'Quand l''argent est prélevé. « À la finalisation » se contente d''autoriser le paiement lors de la commande et le capture lorsque le paiement est finalisé dans Sylius (par ex. à l''expédition de la commande) — le réglage par défaut, et ce dont ont besoin les boutiques qui ne peuvent pas capturer avant l''expédition. « Immédiatement » laisse Quickpay capturer dès que la carte est autorisée — pratique pour les produits numériques'
                capture_mode_option:
                    on_completion: 'À la finalisation — autoriser lors de la commande, capturer lorsque le paiement est finalisé'
                    immediately: 'Immédiatement — capturer lors de la commande'
                synchronized: 'Opérations synchrones'
                synchronized_help: 'Exécuter la capture, le remboursement et l''annulation de manière synchrone au lieu de s''appuyer sur le callback Quickpay'
                order_prefix: 'Préfixe de commande'
                order_prefix_help: 'Ajouté devant les numéros de commande pour former l''ID de commande Quickpay — doit être unique par projet et environnement partageant le même compte Quickpay, 11 caractères maximum'
                branding_id: 'ID de branding'
                branding_id_help: 'Facultatif : l''ID du branding de la fenêtre de paiement à utiliser'
    ui:
        operations: 'Opérations Quickpay'
        loading: 'Chargement de l''historique des opérations Quickpay…'
        load_failed: 'Impossible de charger l''historique des opérations depuis Quickpay.'
        retry: 'Réessayer'
        type: 'Type'
        amount: 'Montant'
        status: 'Statut'
        date: 'Date'
        pending: 'en attente'
        no_operations: 'Aucune opération pour le moment'
        balance: 'Solde capturé'
        test_mode: 'Mode test'
        fraud_suspected: 'Suspicion de fraude'
        payment_link: 'Lien de paiement'
        payment_link_help: 'Toute personne disposant de ce lien peut payer la commande dans la fenêtre de paiement Quickpay — envoyez-le au client pour encaisser une commande par téléphone ou sur facture, ou après un paiement abandonné.'
        copy: 'Copier'
        copied: 'Copié'
        send_payment_link: 'Envoyer le lien de paiement à %email%'
    email:
        payment_link:
            subject: 'Paiement de la commande %order_number%'
            intro: 'Votre commande %order_number% est en attente d''un paiement de %amount% — utilisez le bouton ci-dessous pour payer en toute sécurité dans la fenêtre de paiement Quickpay.'
            action: 'Payer maintenant'
            fallback: 'Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :'
