setono_sylius_quickpay:
    payum_gateway_factory:
        quickpay: Quickpay
    form:
        gateway_configuration:
            quickpay:
                api_key: 'Klucz API'
                api_key_help: 'Klucz API użytkownika API w Twoim managerze Quickpay (Ustawienia → Użytkownicy)'
                private_key: 'Klucz prywatny'
                private_key_help: 'Klucz prywatny Twojego konta (Ustawienia → Integracja w managerze Quickpay)'
                agreement_id: 'ID umowy'
                agreement_id_help: 'Opcjonalne: której umowy używa okno płatności. Pozostaw puste, aby użyć domyślnej umowy okna płatności konta Quickpay — wypełnij tylko wtedy, gdy konto ma kilka umów, a okno ma używać konkretnej z nich'
                payment_methods: 'Metody płatności'
                payment_methods_help: 'Rozdzielona przecinkami lista metod płatności oferowanych w oknie płatności — zobacz <a href="https://learn.quickpay.net/tech-talk/appendixes/payment-methods/#payment-methods" target="_blank" rel="noopener">dokumentację Quickpay</a>'
                capture_mode: 'Moment pobrania środków'
                capture_mode_help: 'Kiedy pobierane są pieniądze. "Przy zakończeniu" jedynie autoryzuje płatność w kasie i pobiera środki, gdy płatność zostanie zakończona w Sylius (np. przy wysyłce zamówienia) — ustawienie domyślne, i to, czego potrzebują sklepy, które nie mogą pobierać środków przed wysyłką. "Natychmiast" pozwala Quickpay pobrać środki w chwili autoryzacji karty — przydatne dla produktów cyfrowych'
                capture_mode_option:
                    on_completion: 'Przy zakończeniu — autoryzuj w kasie, pobierz środki po zakończeniu płatności'
                    immediately: 'Natychmiast — pobierz środki w kasie'
                synchronized: 'Operacje synchroniczne'
                synchronized_help: 'Wykonuj pobranie, zwrot i anulowanie synchronicznie zamiast polegać na callbacku Quickpay'
                order_prefix: 'Prefiks zamówienia'
                order_prefix_help: 'Dodawany przed numerami zamówień, tworząc ID zamówienia Quickpay — musi być unikalny dla projektu i środowiska współdzielących to samo konto Quickpay, maksymalnie 11 znaków'
                branding_id: 'ID brandingu'
                branding_id_help: 'Opcjonalne: ID brandingu okna płatności do użycia'
    ui:
        operations: 'Operacje Quickpay'
        loading: 'Ładowanie historii operacji Quickpay…'
