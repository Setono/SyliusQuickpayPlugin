setono_sylius_quickpay:
    gateway_configuration:
        agreement_id:
            not_found: 'This agreement doesn''t exist on your Quickpay account. Enter the id of one of its agreements (Settings → Integration in the Quickpay manager), or leave the field empty to use the default Payment Window agreement.'
